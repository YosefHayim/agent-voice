name: CI
'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
