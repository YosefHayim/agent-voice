name: CI

# One install and one `pnpm verify` run cover formatting, types, the code-style
# and style-guide contracts, tests, and the build. agent-voice is macOS-only, so CI
# runs on macOS; tests that need Whisper or Supertonic models skip when the
# models are not present.

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
