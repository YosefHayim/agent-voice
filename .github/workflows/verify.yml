name: Verify
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to check changes against. Empty checks every file.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Biome every file
        if: inputs.since == ''
        run: pnpm exec biome ci .
      - name: Biome the changed files
        if: inputs.since != ''
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched
        env:
          SINCE: ${{ inputs.since }}
      - name: Typecheck
        run: pnpm exec tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsc/agent-voice.tsbuildinfo
      - name: Code style
        run: pnpm style
      - name: Style guide
        run: pnpm style:guide .
      - name: Test every file
        if: inputs.since == ''
        run: pnpm exec vitest run
      - name: Test the changed files
        if: inputs.since != ''
        run: pnpm exec vitest run --changed "$SINCE" --passWithNoTests
        env:
          SINCE: ${{ inputs.since }}
      - name: Build
        run: pnpm build
