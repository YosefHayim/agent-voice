# Every native module here ships a prebuilt darwin-arm64 binary in a platform package,
# so none of their install scripts needs to run.
allowBuilds:
  "@fugood/whisper.node": false
  "@parcel/watcher": false
  esbuild: false
  koffi: false
  msgpackr-extract: false
  onnxruntime-node: false
minimumReleaseAgeExclude:
  - '@clack/core@1.6.0'
  - '@clack/prompts@1.9.0'
